openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: voice-agent
    description: Voice assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /voice-agent/turn:
    post:
      operationId: processVoiceTurn
      tags: [voice-agent]
      summary: Process one recorded voice turn
      description: Transcribes an uploaded recording, generates a concise assistant response, and returns synthesized speech.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceTurnInput"
      responses:
        "200":
          description: Voice turn completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTurnResult"
        "400":
          description: Invalid or missing audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Audio file is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Upstream voice provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VoiceTurnInput:
      type: object
      properties:
        audioBase64:
          type: string
          minLength: 1
          description: Base64-encoded short browser recording.
        audioMimeType:
          type: string
          enum: [audio/webm, audio/wav, audio/ogg, audio/mpeg]
      required:
        - audioBase64
        - audioMimeType
    VoiceTurnResult:
      type: object
      properties:
        requestId:
          type: string
        transcript:
          type: string
        responseText:
          type: string
        audioBase64:
          type: string
          description: Base64-encoded MPEG audio for immediate browser playback.
        audioMimeType:
          type: string
        timings:
          $ref: "#/components/schemas/VoiceTurnTimings"
      required:
        - requestId
        - transcript
        - responseText
        - audioBase64
        - audioMimeType
        - timings
    VoiceTurnTimings:
      type: object
      properties:
        totalMs:
          type: number
        transcriptionMs:
          type: number
        responseMs:
          type: number
        speechMs:
          type: number
      required:
        - totalMs
        - transcriptionMs
        - responseMs
        - speechMs
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        requestId:
          type: string
      required:
        - error
        - code
        - requestId

